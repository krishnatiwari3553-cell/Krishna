<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K & M - Ultimate Tech & Cosmic Vibe</title>
    <!-- Modern Tech & Sci-Fi Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #02050a; /* Ultra Dark Cosmic Background */
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Cosmic & Sci-Fi Glow Background */
        .bg-glow {
            position: absolute;
            width: 200vw;
            height: 200vh;
            background: radial-gradient(circle at 30% 70%, rgba(0, 212, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 70% 30%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(184, 41, 255, 0.03) 0%, transparent 60%);
            animation: cosmicRotate 20s infinite linear;
            z-index: 0;
        }

        @keyframes cosmicRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Floating Tech & Cosmic Particles */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            bottom: -10%;
            animation: floatUp linear infinite;
            opacity: 0.5;
            font-family: 'Share Tech Mono', monospace;
            filter: drop-shadow(0 0 5px currentColor);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        /* --- Rotating Energy Border (Charo Taraf Animation) --- */
        .animated-wrapper {
            position: relative;
            padding: 4px; /* Border thickness */
            border-radius: 25px;
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1), 0 0 60px rgba(0, 255, 136, 0.05);
            transition: transform 0.4s ease;
        }

        .animated-wrapper:hover {
            transform: scale(1.02);
        }

        /* Spinning Gradient behind the main container */
        .animated-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                transparent, rgba(0, 212, 255, 0.8), transparent 30%,
                transparent, rgba(0, 255, 136, 0.8), transparent 80%
            );
            animation: spinBorder 4s linear infinite;
            z-index: -1;
        }

        @keyframes spinBorder {
            100% { transform: rotate(360deg); }
        }

        /* Main Glassmorphism Container */
        .glass-container {
            position: relative;
            background: rgba(8, 12, 20, 0.85); /* Deep dark glass */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 70px;
            border-radius: 21px;
            text-align: center;
            min-width: 450px;
            z-index: 10;
        }

        /* --- Cosmic Real Watch --- */
        .cosmic-clock-container {
            margin-bottom: 40px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.05);
            display: inline-block;
        }

        .cosmic-clock {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.2rem;
            color: #e2e8f0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
        }

        .clock-ampm {
            font-size: 1.2rem;
            color: #b829ff; /* Cosmic purple */
            text-shadow: 0 0 10px #b829ff;
            font-weight: bold;
        }

        .clock-tick {
            animation: blinkTick 1s infinite;
        }

        @keyframes blinkTick {
            50% { opacity: 0.3; }
        }

        /* --- Name Rows & Glass Boxes --- */
        .name-wrapper {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }

        /* KRISHNA: Blue Transparent Glass */
        .krishna-glass {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.2), inset 0 0 15px rgba(0, 212, 255, 0.1);
            padding: 15px 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        /* MOHIT: Green Transparent Glow Glass */
        .mohit-glass {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.2), inset 0 0 15px rgba(0, 255, 136, 0.1);
            padding: 15px 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        /* Typography */
        .name-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            border-right: 4px solid transparent; /* Blinking cursor base */
            display: inline-block;
            min-width: 10px; /* space for cursor */
        }

        .krishna-text {
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff, 0 0 30px #00d4ff;
        }

        .mohit-text {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 30px #00ff88;
        }

        /* Tech Ampersand */
        .ampersand-container {
            margin: 20px 0;
        }

        .ampersand {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #b829ff, 0 0 40px #b829ff;
            opacity: 0;
            transform: scale(0);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ampersand.show {
            opacity: 1;
            transform: scale(1);
            animation: energyPulse 2s infinite alternate;
        }

        @keyframes energyPulse {
            0% { transform: scale(1); text-shadow: 0 0 10px #fff, 0 0 20px #b829ff; }
            100% { transform: scale(1.1); text-shadow: 0 0 15px #fff, 0 0 35px #b829ff, 0 0 60px #b829ff; }
        }

        /* Blinking Tech Cursor Animation */
        .typing-cursor {
            animation: cursorBlink 0.8s infinite;
        }
        
        @keyframes cursorBlink {
            0%, 100% { border-right-color: transparent; }
            50% { border-right-color: #fff; }
        }

        /* Tagline */
        .tagline {
            margin-top: 30px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: #64748b;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .tagline.show {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <!-- Cosmic Tech Background -->
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>

    <!-- Animated Wrapping Border -->
    <div class="animated-wrapper">
        <!-- Main Container -->
        <div class="glass-container">
            
            <!-- Cosmic Real Watch -->
            <div class="cosmic-clock-container">
                <div class="cosmic-clock" id="clock-display">
                    <span id="hours">00</span><span class="clock-tick">:</span><span id="minutes">00</span><span class="clock-tick">:</span><span id="seconds">00</span>
                    <span class="clock-ampm" id="ampm">AM</span>
                </div>
            </div>
            
            <!-- KRISHNA: Blue Glass Box -->
            <div class="name-wrapper">
                <div class="krishna-glass">
                    <span id="krishna-text" class="name-text krishna-text"></span>
                </div>
            </div>

            <!-- Glowing & -->
            <div class="ampersand-container">
                <span id="amp" class="ampersand">&</span>
            </div>

            <!-- MOHIT: Green Glass Box -->
            <div class="name-wrapper">
                <div class="mohit-glass">
                    <span id="mohit-text" class="name-text mohit-text"></span>
                </div>
            </div>

            <!-- Tagline -->
            <div id="tagline" class="tagline">SYSTEM SYNCHRONIZED</div>
        </div>
    </div>

    <script>
        // --- 1. Cosmic Clock Logic ---
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            let ampm = h >= 12 ? 'PM' : 'AM';

            // Convert to 12-hour format
            h = h % 12;
            h = h ? h : 12; // the hour '0' should be '12'

            // Add leading zeros
            h = h < 10 ? '0' + h : h;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;

            // Update DOM
            document.getElementById('hours').innerText = h;
            document.getElementById('minutes').innerText = m;
            document.getElementById('seconds').innerText = s;
            document.getElementById('ampm').innerText = ampm;
        }

        // Start clock immediately and update every second
        setInterval(updateClock, 1000);
        updateClock();


        // --- 2. Slow Typing Effect Logic ---
        const krishnaEl = document.getElementById('krishna-text');
        const mohitEl = document.getElementById('mohit-text');
        const ampEl = document.getElementById('amp');
        const taglineEl = document.getElementById('tagline');

        const krishnaStr = "KRISHNA";
        const mohitStr = "MOHIT";
        
        // Typing timing aur zyada dheere kar di hai (350ms per letter)
        const typingSpeed = 350; 

        async function typeWriter(element, text) {
            element.classList.add('typing-cursor');
            for(let i = 0; i < text.length; i++) {
                element.textContent += text.charAt(i);
                await new Promise(r => setTimeout(r, typingSpeed));
            }
            element.classList.remove('typing-cursor');
        }

        async function startAnimation() {
            // Wait a little before starting
            await new Promise(r => setTimeout(r, 1000));
            
            // Type Krishna slowly
            await typeWriter(krishnaEl, krishnaStr);
            
            // Show Tech &
            ampEl.classList.add('show');
            await new Promise(r => setTimeout(r, 1000));
            
            // Type Mohit slowly
            await typeWriter(mohitEl, mohitStr);

            // Show tagline at the end
            await new Promise(r => setTimeout(r, 800));
            taglineEl.classList.add('show');
        }


        // --- 3. Background Tech/Cosmic Particles ---
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleTypes = ['0', '1', '✦', '/>', '{ }', '✧', '[ ]', '⚡']; 
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const type = particleTypes[Math.floor(Math.random() * particleTypes.length)];
                particle.textContent = type;
                
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.fontSize = (Math.random() * 14 + 10) + 'px';
                particle.style.animationDuration = (Math.random() * 6 + 5) + 's';
                
                // Color distribution
                const colorChoice = Math.random();
                if (colorChoice < 0.3) {
                    particle.style.color = '#00d4ff'; // Blue
                } else if (colorChoice < 0.6) {
                    particle.style.color = '#00ff88'; // Green
                } else if (colorChoice < 0.8) {
                    particle.style.color = '#b829ff'; // Purple
                } else {
                    particle.style.color = '#ffffff'; // White
                }

                particlesContainer.appendChild(particle);

                // Cleanup
                setTimeout(() => {
                    particle.remove();
                }, 11000);
            }, 300); 
        }

        // Initialize Everything
        window.onload = () => {
            createParticles();
            startAnimation();
        };
    </script>
</body>
</html>
